title = "Web3 Companion Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Local runtime state and generated dependency trees are not release inputs"
paths = [
  '''(^|/)docker/data[^/]*(/|$)''',
  '''(^|/)node_modules(/|$)''',
  '''(^|/)frontend/node_modules(/|$)''',
  '''(^|/)companion/node_modules(/|$)''',
  '''(^|/)frontend/dist(/|$)''',
  '''(^|/)companion/dist(/|$)''',
  '''(^|/)dist(/|$)''',
]

[[allowlists]]
description = "Ignored local deployment env files are checked separately by scripts/check-sensitive-data.sh"
paths = [
  '''(^|/)docker/\.env(\..*)?$''',
  '''(^|/)\.env(\..*)?$''',
]

[[allowlists]]
description = "Public EVM addresses and transaction hashes are not secrets"
regexes = [
  '''0x[0-9a-fA-F]{40}''',
  '''0x[0-9a-fA-F]{64}''',
]

[[allowlists]]
description = "Documentation placeholder values"
regexes = [
  '''WEB3_SSM_KEY=[A-Za-z0-9+/=_-]*example[A-Za-z0-9+/=_-]*''',
  '''WEB3_JWT_SECRET=[A-Za-z0-9+/=_-]*example[A-Za-z0-9+/=_-]*''',
]
